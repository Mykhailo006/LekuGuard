<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LekuGuard</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a1628;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
.screen{background:#0D1B2A;width:100%;max-width:390px;min-height:100vh}
.nav{display:flex;border-bottom:0.5px solid rgba(255,255,255,0.08)}
.nav-btn{flex:1;padding:13px 4px;font-size:13px;background:transparent;border:none;color:rgba(255,255,255,0.35);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.nav-btn.on{color:#00C9A7;border-bottom-color:#00C9A7}
.content{padding:16px;display:none}
.content.on{display:block}
.shield-wrap{display:flex;flex-direction:column;align-items:center;padding:32px 0 24px}
.shield{width:120px;height:130px;position:relative;display:flex;align-items:center;justify-content:center}
.shield-bg{position:absolute;inset:0}
.shield-label{font-size:40px;position:relative;z-index:1}
.status-title{font-size:22px;font-weight:500;color:#fff;text-align:center;margin-bottom:6px}
.status-sub{font-size:13px;color:rgba(255,255,255,0.45);text-align:center;margin-bottom:24px}
.metrics{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:16px}
.metric{background:rgba(255,255,255,0.05);border-radius:14px;padding:16px;border:0.5px solid rgba(255,255,255,0.08)}
.metric-val{font-size:28px;font-weight:500;margin-bottom:4px}
.metric-lbl{font-size:12px;color:rgba(255,255,255,0.4)}
.section-title{font-size:11px;font-weight:500;color:rgba(255,255,255,0.35);text-transform:uppercase;letter-spacing:.08em;margin:0 0 10px}
.device{display:flex;align-items:center;gap:12px;padding:12px 14px;background:rgba(255,255,255,0.04);border-radius:12px;margin-bottom:8px;border:0.5px solid rgba(255,255,255,0.07)}
.device-icon{width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.device-name{font-size:14px;font-weight:500;color:#fff}
.device-sub{font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px}
.pill{font-size:10px;font-weight:500;padding:4px 10px;border-radius:20px;margin-left:auto;white-space:nowrap}
.pill-green{background:rgba(0,201,167,0.15);color:#00C9A7}
.pill-red{background:rgba(226,75,74,0.15);color:#E24B4A}
.pill-amber{background:rgba(186,117,23,0.2);color:#EF9F27}
.alert-item{display:flex;gap:10px;padding:12px 14px;background:rgba(255,255,255,0.04);border-radius:12px;margin-bottom:8px;border-left:2px solid transparent}
.alert-item.danger{border-left-color:#E24B4A}
.alert-item.warning{border-left-color:#EF9F27}
.alert-item.info{border-left-color:#00C9A7}
.alert-dot{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}
.alert-msg{font-size:12px;color:rgba(255,255,255,0.75);line-height:1.5}
.alert-time{font-size:10px;color:rgba(255,255,255,0.3);margin-top:3px;font-family:monospace}
.empty{font-size:13px;color:rgba(255,255,255,0.25);text-align:center;padding:24px}
.header{padding:16px 16px 0;display:flex;align-items:center;gap:8px}
.header-dot{width:7px;height:7px;border-radius:50%;background:#00C9A7;animation:pulse 2s infinite}
.header-title{font-size:15px;font-weight:500;color:#fff}
.reset-btn{width:100%;padding:12px;background:rgba(226,75,74,0.1);border:0.5px solid rgba(226,75,74,0.3);border-radius:12px;color:#E24B4A;font-size:14px;cursor:pointer;margin-top:8px}
@keyframes pulse{0%,100%{opacity:.5}50%{opacity:1}}
</style>
</head>
<body>
<div class="screen">
  <div class="header">
    <div class="header-dot"></div>
    <div class="header-title">LekuGuard</div>
  </div>
  <div class="nav">
    <button class="nav-btn on" onclick="tab('status')">Status</button>
    <button class="nav-btn" onclick="tab('devices')">Devices</button>
    <button class="nav-btn" onclick="tab('alerts')">Alerts</button>
  </div>

  <div class="content on" id="tab-status">
    <div class="shield-wrap">
      <div class="shield">
        <svg class="shield-bg" viewBox="0 0 100 110" fill="none" id="shield-svg">
          <path d="M50 4L8 22v30c0 26 18 48 42 54 24-6 42-28 42-54V22L50 4z" fill="#00C9A7" opacity="0.15"/>
          <path d="M50 4L8 22v30c0 26 18 48 42 54 24-6 42-28 42-54V22L50 4z" fill="none" stroke="#00C9A7" stroke-width="1.5"/>
        </svg>
        <span class="shield-label" id="shield-label" style="color:#00C9A7">✓</span>
      </div>
      <div class="status-title" id="status-title">Network protected</div>
      <div class="status-sub" id="status-sub">All devices are secured</div>
    </div>
    <div class="metrics">
      <div class="metric">
        <div class="metric-val" id="m-trusted" style="color:#00C9A7">2</div>
        <div class="metric-lbl">Trusted</div>
      </div>
      <div class="metric">
        <div class="metric-val" id="m-quarantine" style="color:#EF9F27">0</div>
        <div class="metric-lbl">Quarantined</div>
      </div>
      <div class="metric">
        <div class="metric-val" id="m-blocked" style="color:#E24B4A">0</div>
        <div class="metric-lbl">Blocked</div>
      </div>
      <div class="metric">
        <div class="metric-val" id="m-detector" style="color:#00C9A7">ON</div>
        <div class="metric-lbl">Detector</div>
      </div>
    </div>
    <button class="reset-btn" onclick="resetStatus()">Reset status</button>
  </div>

  <div class="content" id="tab-devices">
    <div class="section-title" style="margin-top:4px">Trusted devices</div>
    <div class="device">
      <div class="device-icon" style="background:rgba(0,201,167,0.15)">
        <svg width="20" height="20" viewBox="0 0 18 18" fill="none"><rect x="1" y="2" width="16" height="11" rx="2" stroke="#00C9A7" stroke-width="1.3"/><path d="M5 15h8M9 13v2" stroke="#00C9A7" stroke-width="1.3" stroke-linecap="round"/></svg>
      </div>
      <div><div class="device-name">Laptop</div><div class="device-sub">10.0.1.2</div></div>
      <span class="pill pill-green">trusted</span>
    </div>
    <div class="device">
      <div class="device-icon" style="background:rgba(0,201,167,0.15)">
        <svg width="20" height="20" viewBox="0 0 18 18" fill="none"><rect x="4" y="1" width="10" height="16" rx="2" stroke="#00C9A7" stroke-width="1.3"/><circle cx="9" cy="13.5" r="1" fill="#00C9A7"/></svg>
      </div>
      <div><div class="device-name">Gateway</div><div class="device-sub">10.0.1.1</div></div>
      <span class="pill pill-green">trusted</span>
    </div>
    <div class="section-title" style="margin-top:16px">IoT quarantine</div>
    <div id="iot-devices"><div class="empty">No IoT devices detected</div></div>
  </div>

  <div class="content" id="tab-alerts">
    <div class="section-title" style="margin-top:4px">Recent events</div>
    <div id="alert-list"><div class="empty">No events yet</div></div>
  </div>
</div>

<script>
const API='https://lustfully-capitol-aghast.ngrok-free.dev';
const H={'ngrok-skip-browser-warning':'true'};

function tab(name){
  document.querySelectorAll('.nav-btn').forEach((b,i)=>{
    b.classList.toggle('on',['status','devices','alerts'][i]===name);
  });
  document.querySelectorAll('.content').forEach(c=>c.classList.remove('on'));
  document.getElementById('tab-'+name).classList.add('on');
}

async function fetchData(){
  try{
    const[s,d,a]=await Promise.all([
      fetch(API+'/api/status',{headers:H}).then(r=>r.json()),
      fetch(API+'/api/devices',{headers:H}).then(r=>r.json()),
      fetch(API+'/api/alerts',{headers:H}).then(r=>r.json())
    ]);
    updateStatus(s);updateDevices(d);updateAlerts(a);
  }catch(e){console.log(e);}
}

function updateStatus(s){
  let col,label,title,sub;
  if(s.status==='offline'){
    col='#888';label='?';
    title='Detector is offline';
    sub='Run start.sh to activate';
  }else if(s.status==='alert'){
    col='#E24B4A';label='!';
    title='Threat detected';
    sub=`${s.blocked} device${s.blocked!==1?'s':''} blocked`;
  }else if(s.status==='warning'){
    col='#EF9F27';label='!';
    title='Device in quarantine';
    sub=`${s.quarantine} device${s.quarantine!==1?'s':''} isolated`;
  }else{
    col='#00C9A7';label='✓';
    title='Network protected';
    sub='All devices are secured';
  }
  const svg=document.getElementById('shield-svg');
  svg.querySelectorAll('path').forEach(p=>{
    if(p.getAttribute('fill')!=='none')p.setAttribute('fill',col);
    else p.setAttribute('stroke',col);
  });
  document.getElementById('shield-label').style.color=col;
  document.getElementById('shield-label').textContent=label;
  document.getElementById('status-title').textContent=title;
  document.getElementById('status-sub').textContent=sub;
  document.getElementById('m-trusted').textContent=s.trusted;
  document.getElementById('m-quarantine').textContent=s.quarantine;
  document.getElementById('m-blocked').textContent=s.blocked;
  const det=document.getElementById('m-detector');
  det.textContent=s.detector?'ON':'OFF';
  det.style.color=s.detector?'#00C9A7':'#E24B4A';
}

function updateDevices(devices){
  const iot=devices.filter(d=>d.status!=='trusted');
  const el=document.getElementById('iot-devices');
  if(!iot.length){el.innerHTML='<div class="empty">No IoT devices detected</div>';return;}
  el.innerHTML=iot.map(d=>`
    <div class="device">
      <div class="device-icon" style="background:${d.status==='blocked'?'rgba(226,75,74,0.15)':'rgba(186,117,23,0.15)'}">
        <svg width="20" height="20" viewBox="0 0 18 18" fill="none">
          <ellipse cx="9" cy="7" rx="5" ry="6" stroke="${d.status==='blocked'?'#E24B4A':'#EF9F27'}" stroke-width="1.3"/>
          <rect x="7" y="12" width="4" height="2" rx="1" stroke="${d.status==='blocked'?'#E24B4A':'#EF9F27'}" stroke-width="1.3"/>
        </svg>
      </div>
      <div><div class="device-name">${d.name}</div><div class="device-sub">${d.ip}</div></div>
      <span class="pill ${d.status==='blocked'?'pill-red':'pill-amber'}">${d.status}</span>
    </div>
  `).join('');
}

function updateAlerts(alerts){
  const el=document.getElementById('alert-list');
  if(!alerts.length){el.innerHTML='<div class="empty">No events yet</div>';return;}
  el.innerHTML=alerts.slice(0,15).map(a=>`
    <div class="alert-item ${a.type}">
      <div class="alert-dot" style="background:${a.type==='danger'?'#E24B4A':a.type==='warning'?'#EF9F27':'#00C9A7'}"></div>
      <div>
        <div class="alert-msg">${a.msg.length>65?a.msg.slice(0,65)+'...':a.msg}</div>
        <div class="alert-time">${a.time}</div>
      </div>
    </div>
  `).join('');
}

async function resetStatus(){
  try{
    await fetch(API+'/api/reset',{method:'POST',headers:H});
    await fetchData();
  }catch(e){console.log(e);}
}

fetchData();
setInterval(fetchData,3000);
</script>
</body>
</html>
